# Alerting rules — the in-system rule engine, Layer 1 of ADR-0019 (gh#245, R-13).
#
# EVERY RULE HERE READS A METRIC THAT IS ACTUALLY EMITTED. That is the single discipline this file lives by: a
# rule referencing a metric nothing produces evaluates forever without firing and looks identical to "healthy",
# which is precisely the silent failure ADR-0019 exists to close. The conditions ADR-0019 names that have no
# instrument behind them was listed at the bottom of this file rather than written as a dead rule; gh#370 closed
# that list out.
#
# Metric names are the OTLP -> Prometheus remote-write translation of the instruments in ExecutionMetrics.cs:
# dots become underscores, counters gain `_total`, and `ms` histograms gain `_milliseconds`.
#
# THE BACKSTOP CONTRACT (gh#242): the app pushes the P1 flatten conditions directly, because a scrape plus a rule
# evaluation costs tens of seconds on a path where CL and GC have ~15 minutes of total margin. These rules are the
# backstop for when the app is alive but NOT self-reporting, so every flatten P1 here carries `for: 2m` — longer
# than the direct push's latency, so the fast path wins the race and this layer fires only when it did not.

groups:
  # ---------------------------------------------------------------------------------------------------------
  # P1 — page. Pushover Emergency: repeats until acknowledged, bypasses DND, never quiet-hour suppressed.
  # ---------------------------------------------------------------------------------------------------------
  - name: trading-p1
    interval: 15s
    rules:
      - alert: FlattenEscalated
        # The primary exhausted MaxFlattenAttempts with exposure remaining. ADR-0019 is explicit that this, not
        # `missed`, is the page-worthy signal: `missed` fires 60 minutes late, after Topstep's ~15:10 backstop.
        expr: increase(trading_flatten_deadlines_total{tier="primary",outcome="escalated"}[5m]) > 0
        for: 2m
        labels:
          priority: P1
          component: flatten
        annotations:
          summary: "Auto-flatten ESCALATED — exposure remains after the primary's close attempts"
          description: >-
            The primary auto-flatten exhausted its close attempts with a position still open. Three closes failed
            against the venue, and the watchdog uses the same venue. Flatten manually NOW.
          runbook: "documentation/deployment-runbook.md#auto-flatten-failure"

      - alert: FlattenMissed
        # Exposure past the firing window, from either tier. The watchdog's own `missed` is ADR-0019's
        # `flatten.watchdog.critical` — the last line having failed.
        expr: increase(trading_flatten_deadlines_total{outcome="missed"}[5m]) > 0
        for: 2m
        labels:
          priority: P1
          component: flatten
        annotations:
          summary: "Auto-flatten MISSED on {{ $labels.tier }} — exposure past the firing window"
          description: >-
            A flatten deadline passed with exposure still open. On the watchdog tier this is the last line having
            failed (ADR-0019's watchdog.critical). Flatten manually NOW.
          runbook: "documentation/deployment-runbook.md#auto-flatten-failure"

      - alert: OrphanedStopsWithExposure
        # `trading_stops_orphaned` is set by the orphan guard: working stops that are no longer venue-held while a
        # position is live. ADR-0007's synthetic_risk case, made pageable.
        expr: trading_stops_orphaned > 0
        for: 2m
        labels:
          priority: P1
          component: execution
        annotations:
          summary: "{{ $value }} working stop(s) ORPHANED — protection is platform-held, not exchange-held"
          description: >-
            A venue-connection drop moved working stops to Orphaned. The native safety stop is still the physical
            floor, but the working stop is no longer where the plan says it is.
          runbook: "documentation/deployment-runbook.md#orphaned-stops"

      - alert: UnprotectedPosition
        # THE condition ADR-0019 named first and gh#245 could not write, because nothing measured it. gh#370's
        # protection census reconciles venue positions against venue working orders; this is a live position with
        # no stop resting at the exchange — the state the whole staged-stop model exists to make impossible.
        #
        # `for: 2m` is not timidity: a bracket attaches on FILL, so a position is legitimately unprotected for the
        # moment between the two. Paging on that would page on every single entry, and a pager that cries on
        # normal operation is one nobody reads. Two minutes is far longer than an attach and far shorter than a
        # session.
        expr: trading_positions_unprotected > 0
        for: 2m
        labels:
          priority: P1
          component: execution
        annotations:
          summary: "{{ $value }} live position(s) have NO stop resting at the exchange"
          description: >-
            The venue reports open exposure with no protective stop order behind it. This is the failure the
            staged-stop model exists to prevent. Place a stop manually NOW, or flatten.
          runbook: "documentation/deployment-runbook.md#unprotected-position"

      - alert: TelemetryPipelineSilent
        # A rule engine reading a dead feed reports "healthy" forever. ADR-0019 calls the silent monitor the same
        # failure class as the silent fault, so absence of the app's own heartbeat metric is itself a P1.
        expr: absent(trading_flatten_deadlines_total)
        for: 15m
        labels:
          priority: P1
          component: observability
        annotations:
          summary: "No flatten-deadline metrics for 15m — the app is not reporting"
          description: >-
            The auto-flatten loop emits a deadline metric on EVERY evaluation, including idle ones, so silence
            here means the app is down, the collector is broken, or remote write has stopped. Every other rule in
            this file is blind until it clears — assume unmonitored, not healthy.
          runbook: "documentation/deployment-runbook.md#telemetry-pipeline"

      - alert: NotificationDeliveryRefused
        # gh#1077. QueuedNotificationChannel refuses rather than accepts when its bounded queue is full, and the
        # queue is fullest exactly when a transport is not draining -- which is when the flatten escalation is
        # also enqueuing. LAYER 1 CANNOT REPORT THIS ONE ITSELF: the push it would use is the push that did not
        # go. So it is metered and carried here, which is what Layer 2 is for. `kind` is page or resolve; a
        # refused resolve is the worse of the two, because nothing above the queue records that one is owed.
        expr: increase(trading_notifications_refused_total[5m]) > 0
        labels:
          priority: P1
          component: alerting
        annotations:
          summary: "Operator notifications REFUSED ({{ $labels.kind }}) — the app cannot page"
          description: >-
            The in-process notification queue refused at least one notification, so a page the app raised did not
            reach the transport. Assume the operator has NOT been told about whatever raised it — check the API
            logs for "Notification queue is full" and treat every flatten condition as unreported until this
            clears.
          runbook: "documentation/deployment-runbook.md#notifications-refused"

  # ---------------------------------------------------------------------------------------------------------
  # P2 — notify. Single normal-priority push, suppressed outside 06:00–17:00 CT.
  # ---------------------------------------------------------------------------------------------------------
  - name: trading-p2
    interval: 15s
    rules:
      - alert: WatchdogSaved
        # The watchdog firing at all means the primary tier is broken. Nothing is exposed right now, so it is not
        # a page — but it must be fixed before the next session.
        expr: increase(trading_flatten_deadlines_total{tier="watchdog",outcome="executed"}[5m]) > 0
        labels:
          priority: P2
          component: flatten
        annotations:
          summary: "The WATCHDOG flattened — the primary tier did not"
          description: >-
            Exposure was closed by the last line rather than the first. Nothing is open now, but the primary tier
            is broken and must be fixed before the next session.

      - alert: FlattenDisabledWithExposure
        # The name promised "with exposure" and the expression did not check it (gh#245). gh#370's open-position
        # gauge makes the name true: a disabled deadline on a flat book is a configuration choice, not an alert.
        expr: increase(trading_flatten_deadlines_total{outcome="disabled"}[5m]) > 0 and on() trading_positions_open > 0
        labels:
          priority: P2
          component: flatten
        annotations:
          summary: "A flatten deadline evaluated as DISABLED while a position is open"
          description: >-
            A market with a deliberately disabled flatten deadline was evaluated while exposure is open. R-13's
            guarantee does not apply to that market.

      - alert: FlattenUnconfiguredWithExposure
        # Distinct from `disabled` since gh#370. Deliberately switched off and never configured at all are
        # different operator errors, and only the second is a surprise — which is exactly why it deserves its own
        # alert rather than being folded into the one above. The emit site fires only with a live position.
        expr: increase(trading_flatten_deadlines_total{outcome="unconfigured"}[5m]) > 0
        labels:
          priority: P2
          component: flatten
        annotations:
          summary: "Open position in a product with NO configured flatten deadline"
          description: >-
            A live position sits in a product that has no auto-flatten deadline configured, so R-13 cannot time
            its flatten. Configure a deadline for it, or do not hold it overnight.

      - alert: FlattenWarning
        # The pre-deadline warning PRD P1 asks for. Journalled since gh#12, metered since gh#370 — the one signal
        # that arrives BEFORE exposure becomes a problem, and therefore the only one that can still be acted on
        # calmly.
        expr: increase(trading_flatten_deadlines_total{outcome="warning"}[5m]) > 0
        labels:
          priority: P2
          component: flatten
        annotations:
          summary: "Auto-flatten deadline approaching with a position still open"
          description: "The flatten will run shortly. Close on your own terms first if you would rather."

      - alert: WatchdogCloseRejected
        # Separated from `escalated` by gh#370: escalation means attempts EXHAUSTED, this means one attempt
        # bounced. Conflated, a single bad close looked identical to the tier giving up.
        expr: increase(trading_flatten_deadlines_total{tier="watchdog",outcome="rejected"}[5m]) > 0
        labels:
          priority: P2
          component: flatten
        annotations:
          summary: "A watchdog close was rejected or left exposure open"
          description: >-
            The watchdog attempted a close and the venue did not fully honour it. It retries next pass; if it
            keeps failing, the P1 escalation or missed alert follows.

      - alert: VenueDisconnectedWithExposure
        # ADR-0019's "connection lost > 2 min with a position open". The duration lives in `for:` rather than in
        # application code — which is why gh#370 emits connection state as a GAUGE re-stated every pass rather
        # than as a transition event.
        expr: trading_venue_connected == 0 and on() trading_positions_open > 0
        for: 2m
        labels:
          priority: P2
          component: execution
        annotations:
          summary: "Venue connection down for over 2 minutes with a position open"
          description: >-
            Synthetic protection depends on this process reaching the venue. Hidden stops have been orphaned and
            the native safety stop is the floor until the connection returns.

      - alert: KillSwitchEngaged
        expr: trading_killswitch_engaged > 0
        for: 1m
        labels:
          priority: P2
          component: execution
        annotations:
          summary: "The kill switch is ENGAGED — outbound order capability is disabled"
          description: "Deliberate if you engaged it. If you did not, something else did."

      - alert: EventLogRetentionGap
        # gh#227's signal, raised to a notification. gh#306 backfills what it can; a shortfall is still lost.
        expr: increase(trading_eventlog_retention_gaps_total[15m]) > 0
        labels:
          priority: P2
          component: eventlog
        annotations:
          summary: "Consumer {{ $labels.consumer_group }} fell behind the event-log retention window"
          description: >-
            Its cursor dropped off the back of the 24h window. gh#306 backfills the blind window from the
            clean-historical store where it can. If any of it could NOT be covered, BackfillShortfall fires
            alongside this with the contract and the uncovered duration — this alert alone does not mean data
            was lost.

      - alert: BackfillShortfall
        # gh#482. The recovery in gh#306 is best-effort, and until now its FAILURE reached nobody: the shortfall
        # was a log line, and the alert above told the operator to go and read it. The `_count` of the histogram
        # is the "did it happen" signal; the distribution carries how bad. Emitted ONLY on a shortfall, so a clean
        # recovery cannot fire this (ADR-0019 §4).
        expr: increase(trading_stops_backfill_shortfall_milliseconds_count[15m]) > 0
        labels:
          priority: P2
          component: execution
        annotations:
          summary: "Blind-window recovery could not cover {{ $labels.contract }} — hidden stops may be unprotected"
          description: >-
            The clean-historical store had no bars for part of the window the consumer was blind for, so hidden
            stops on this contract may have crossed their promotion band unobserved and were NOT promoted. The
            native safety stop is the only floor on them until the next quote re-evaluates. Check open positions
            on this contract before the session close.
          runbook: "documentation/deployment-runbook.md#backfill-shortfall"

      - alert: TimeToFlatSlow
        # ADR-0019's p95 > 60s. Not yet a failure — a warning that the margin is being eaten.
        expr: >-
          histogram_quantile(0.95,
            sum by (le, tier) (rate(trading_flatten_time_to_flat_milliseconds_bucket[30m]))) > 60000
        for: 5m
        labels:
          priority: P2
          component: flatten
        annotations:
          summary: "Time-to-flat p95 above 60s on {{ $labels.tier }}"
          description: >-
            Flattens are completing, but slowly enough that the margin before the close is being consumed.

  # ---------------------------------------------------------------------------------------------------------
  # P3 — quiet push. Delivered, no sound: the flatten confirmation PRD P1 asks for, at zero fatigue cost.
  # ---------------------------------------------------------------------------------------------------------
  - name: trading-p3
    interval: 15s
    rules:
      - alert: FlattenExecuted
        expr: increase(trading_flatten_deadlines_total{tier="primary",outcome="executed"}[5m]) > 0
        labels:
          priority: P3
          component: flatten
        annotations:
          summary: "Auto-flatten completed normally"
          description: "The primary tier closed exposure at the deadline. Nothing to do."

  # ---------------------------------------------------------------------------------------------------------
  # The Alertmanager heartbeat. Always firing, by design.
  # ---------------------------------------------------------------------------------------------------------
  - name: trading-heartbeat
    interval: 15s
    rules:
      - alert: Watchdog
        # Routed to a dead-man's-switch receiver: an alert that ALWAYS fires proves the whole chain — scrape,
        # rule evaluation, routing, delivery — is alive. Its ABSENCE is the signal. ADR-0019: a silent rule
        # engine is the same failure class this decision exists to close.
        expr: vector(1)
        labels:
          priority: heartbeat
        annotations:
          summary: "Alerting pipeline heartbeat — its absence means the pipeline is dead"

# -----------------------------------------------------------------------------------------------------------
# EVERY CONDITION ADR-0019 NAMES NOW HAS A RULE (gh#370 closed the last gap).
#
# gh#245 shipped this file with a list here of conditions it deliberately refused to write, because no instrument
# emitted them and a rule over a non-existent metric fires nothing while reading as healthy. gh#370 added the
# instruments — the protection census, the venue-connected gauge, and distinct `warning` / `unconfigured` /
# `rejected` flatten outcomes — so the list is empty and this comment is its receipt.
#
# The one deliberate absence remains, and is not a gap: the **daily check-in** (gh#244) is ADR-0019's Layer 2,
# external by design and deliberately NOT dependent on this stack — a dead-man's switch that ran here would die
# with the thing it watches.
#
# If you add a rule, add its promtool test in ./tests, and keep the clean-session fixture asserting ZERO P1 and
# P2. A rule that pages on a healthy day is a defect in the rule.
