# Loki — logs (gh#231, ADR-0002).
#
# Every log line carries trace_id / span_id (engineering §7), which is what makes a log pivot to its trace in
# Grafana. Single-binary filesystem mode: a developer stack, not a cluster.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7 days, matching Prometheus and Tempo -- see the note in tempo.yaml.
  retention_period: 168h
  # The app's own event log is deliberately short-lived (ADR-0001); these are operational logs, not that.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Accept the resource attributes the collector forwards as structured metadata, so service.name and
  # trace_id survive the trip and stay queryable.
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  # Self-hosted, single-operator (ADR-0015): no usage reporting to a third party.
  reporting_enabled: false
