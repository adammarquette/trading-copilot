<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Trading Co-Pilot">
  <title>Trading Co-Pilot — Candle Reticle (a cockpit locked on a setup)</title>
  <!-- Hybrid of B (candle sequence = the setup) + D (HUD reticle = the cockpit sight locked onto it). -->
  <rect width="64" height="64" rx="14" fill="#101318"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#29313F"/>
  <!-- reticle: four corner brackets (the cockpit sight) -->
  <g fill="none" stroke="#9DC3FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5">
    <path d="M17.5 25 L17.5 17.5 L25 17.5"/>
    <path d="M39 17.5 L46.5 17.5 L46.5 25"/>
    <path d="M17.5 39 L17.5 46.5 L25 46.5"/>
    <path d="M46.5 39 L46.5 46.5 L39 46.5"/>
  </g>
  <!-- the setup: three ascending candles, framed inside the reticle -->
  <g stroke="#9DC3FF" stroke-width="2" stroke-linecap="round">
    <g opacity=".4"><path d="M27 31 V40"/><rect x="25" y="33.5" width="4" height="5" rx="1.3" fill="#9DC3FF" stroke="none"/></g>
    <g opacity=".7"><path d="M32 28 V38"/><rect x="30" y="30" width="4" height="6" rx="1.3" fill="#9DC3FF" stroke="none"/></g>
    <g><path d="M37 25 V35"/><rect x="35" y="27" width="4" height="6.5" rx="1.3" fill="#9DC3FF" stroke="none"/></g>
  </g>
</svg>
