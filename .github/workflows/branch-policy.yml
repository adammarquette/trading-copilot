name: Branch policy

# Enforces the promotion ladder documented in CONTRIBUTING.md: develop -> staging -> main,
# with exactly one allowed source per step -- and guards stacked PRs against an
# already-merged base, where a green merge lands work nothing will ever pick up (gh#72).
#
# ENFORCED (gh#45): rulesets on develop/staging/main require these as status checks, so a red
# check now BLOCKS the merge. `ladder` is required on staging/main (it is a no-op pass on develop);
# `commit-hygiene` is required everywhere. `stale-base` is deliberately NOT a required check -- it
# is skipped on the long-lived branches, and a required check that never runs would deadlock the
# merge. `closing-keyword` (gh#406) is ADVISORY -- it warns, never fails, and is not required. The
# rulesets live in repo settings, recorded in the deployment runbook (not this file).

on:
  pull_request:
    # No `branches` filter: the ladder governs staging/main, and the stale-base guard
    # must see every other base (gh#72), so the workflow runs on all PR bases.
    # `labeled` / `unlabeled` so adding the exception label re-runs the check.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ladder:
    name: ladder
    runs-on: ubuntu-latest
    steps:
      - name: Validate the base/head pair
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          # `head_ref` is only the short branch name, so on its own a fork branch *named* `staging`
          # or `develop` would satisfy the ladder. Identity of the head repository is checked too.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          # Whether the PR carries the documented escape hatch for staging.
          HAS_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'ladder-exception') }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD -> $BASE (head repo: ${HEAD_REPO:-unknown})"

          # The ladder governs *this* repository's promoted history. A fork's `staging` is a
          # different lineage, so this is checked before the branch name and carries no exception:
          # the label exists to excuse a branch deviation, not a foreign repository. Fork
          # contributions target `develop`, which has no ladder constraint.
          if [ "${HEAD_REPO:-}" != "$REPO" ]; then
            echo "::error::'$BASE' accepts merges from branches in '$REPO' only — got '$HEAD' on '${HEAD_REPO:-an unknown repository}'. Open fork contributions against 'develop' instead. See CONTRIBUTING.md 'Branching model'."
            exit 1
          fi

          case "$BASE" in
            main)
              # No exception. Production history stays single-source so every release
              # traces back through staging.
              if [ "$HEAD" != "staging" ]; then
                echo "::error::'main' accepts merges from 'staging' only — got '$HEAD'. There is no exception for main; promote through staging instead. See CONTRIBUTING.md 'Branching model'."
                exit 1
              fi
              echo "OK: staging -> main."
              ;;

            staging)
              if [ "$HEAD" = "develop" ]; then
                echo "OK: develop -> staging."
              elif [ "$HAS_EXCEPTION" = "true" ]; then
                echo "::warning::'staging' normally accepts 'develop' only, but this PR carries the 'ladder-exception' label — allowing '$HEAD'. The reason must be stated in the PR description."
              else
                echo "::error::'staging' accepts merges from 'develop' only — got '$HEAD'. If this is a justified exception, state the reason in the PR description and add the 'ladder-exception' label. See CONTRIBUTING.md 'Branching model'."
                exit 1
              fi
              ;;

            *)
              echo "No ladder constraint for base '$BASE'."
              ;;
          esac

  # gh#72: a PR based on a feature branch that has ALREADY merged into develop merges
  # green, closes, and lands its work on a branch nothing will ever merge again. Squash
  # merges rewrite history, so ancestry of the base's tip proves nothing -- the reliable
  # signal is a merged PR whose head was this base branch.
  stale-base:
    name: stale-base
    runs-on: ubuntu-latest
    # Only stacked PRs need this; develop/staging/main are governed by the ladder.
    if: ${{ !contains(fromJSON('["develop", "staging", "main"]'), github.base_ref) }}
    permissions:
      pull-requests: read
    steps:
      - name: Fail if the base branch has already merged
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Stacked PR: base '$BASE' is not a long-lived branch."

          MERGED=$(gh pr list --repo "$REPO" --state merged --head "$BASE" --json number --jq '[.[].number] | join(", #")')
          if [ -n "$MERGED" ]; then
            echo "::error::Base branch '$BASE' already merged (PR #$MERGED). Merging this PR would land its work on a finished branch nothing will merge again (gh#72). Retarget this PR's base to 'develop'."
            exit 1
          fi

          # Legitimately stacked (base still unmerged). One known blind spot: GitHub fires
          # no event on this PR when its base merges later, so the red only appears on the
          # next push/edit/label. Deleting merged branches closes it -- GitHub then auto-
          # retargets child PRs to the deleted branch's own base.
          echo "::warning::Stacked PR (base '$BASE'). Fine while the base is unmerged -- but if the base merges first, retarget this PR to 'develop' before merging it (gh#72)."
          echo "OK: no merged PR has head '$BASE'."

  # gh#104: PRs land by rebase-merge, so every branch commit becomes permanent history.
  # Enforce the floor of "curated units of work": Conventional subjects, no leftover
  # fixup!/squash!/wip commits. Merge commits are skipped -- GitHub's rebase-merge drops
  # them on landing. GitHub-generated 'Revert "..."' subjects pass.
  commit-hygiene:
    name: commit-hygiene
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check every commit is a curated unit of work
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TYPES='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          FAIL=0
          COUNT=0
          while IFS=$'\t' read -r sha parents subject; do
            COUNT=$((COUNT + 1))
            if [ "$parents" -gt 1 ]; then
              echo "SKIP  $sha (merge commit -- rebase-merge drops it): $subject"
              continue
            fi
            if printf '%s' "$subject" | grep -qiE '^(fixup!|squash!|amend!)|^wip\b'; then
              echo "::error::$sha is a leftover work-in-progress commit ('$subject'). Interactive-rebase the branch into units of work before merge (engineering S10, gh#104)."
              FAIL=1
            elif ! printf '%s' "$subject" | grep -qE "^Revert \"|^(${TYPES})(\([[:alnum:]._/-]+\))?!?: .+"; then
              echo "::error::$sha subject is not a Conventional Commit ('$subject'). Every rebase-merged commit becomes permanent history -- give it a type and a purpose (engineering S10, gh#104)."
              FAIL=1
            else
              echo "OK    $sha: $subject"
            fi
          done < <(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | [.sha[0:7], (.parents | length | tostring), (.commit.message | split("\n")[0])] | @tsv')
          echo "$COUNT commit(s) checked."
          exit $FAIL

  # gh#406: a PR can deliver an issue and leave it OPEN when the closing keyword is missing (or written as
  # prose GitHub ignores, e.g. "Settles #N"). The board then advertises finished work as available and a
  # parallel session rebuilds it -- gh#391 cost exactly that. This is WARN-ONLY and deliberately NOT a required
  # check: plenty of PRs legitimately close nothing (a change against an epic, a QA suite that PINS a defect
  # rather than fixing it, a hotfix whose issue another PR closes), so a hard failure would train people to add
  # a false "Closes" -- and a wrongly-closed issue is harder to notice than an open one. It nudges; it never
  # blocks. GitHub closes an issue from a keyword in the PR body OR any commit, so both are checked.
  closing-keyword:
    name: closing-keyword
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Warn when a PR references issues but closes none
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          BODY=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          COMMITS=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].commit.message')
          TEXT=$(printf '%s\n%s' "$BODY" "$COMMITS")

          # Nothing references an issue? Nothing to nudge about.
          if ! printf '%s' "$TEXT" | grep -qE '#[0-9]+'; then
            echo "No issue references in the body or commits -- nothing to check."
            exit 0
          fi

          # A real GitHub closing keyword bound to a number (close|closes|closed | fix|fixes|fixed |
          # resolve|resolves|resolved), optionally 'Closes: #N'. Case-insensitive.
          if printf '%s' "$TEXT" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+'; then
            echo "OK -- a closing keyword is present, so the tracking issue auto-closes on merge."
            exit 0
          fi

          REFS=$(printf '%s' "$TEXT" | grep -oiE '#[0-9]+' | sort -u | tr '\n' ' ')
          echo "::warning::This PR references $REFS but carries no closing keyword (Closes/Fixes/Resolves #N), so no issue will auto-close on merge. If it DELIVERS one, add 'Closes #N'. If it only relates to an epic or pins a defect, this is expected -- the check only nudges (gh#406)."

          # Close-like PROSE that GitHub does NOT treat as a keyword -- the gh#369 trap ("Settles #307"), the most
          # dangerous case because the author believed they had linked it.
          NEARMISS=$(printf '%s' "$TEXT" | grep -oiE '\b(settle[sd]?|deliver[sd]?|complete[sd]?|closes out)[[:space:]]*#?[0-9]+' | sort -u | tr '\n' ' ' || true)
          if [ -n "$NEARMISS" ]; then
            echo "::warning::Found close-like prose GitHub will NOT act on: ${NEARMISS}-- did you mean 'Closes #N'? (gh#406)"
          fi

          exit 0
