name: Branch policy

# Enforces the promotion ladder documented in CONTRIBUTING.md: develop -> staging -> main,
# with exactly one allowed source per step -- and guards stacked PRs against an
# already-merged base, where a green merge lands work nothing will ever pick up (gh#72).
#
# ENFORCED (gh#45): rulesets on develop/staging/main require these as status checks, so a red
# check now BLOCKS the merge. `ladder` is required on staging/main (it is a no-op pass on develop);
# `commit-hygiene` is required everywhere. `stale-base` is deliberately NOT a required check -- it
# is skipped on the long-lived branches, and a required check that never runs would deadlock the
# merge. The rulesets live in repo settings, recorded in the deployment runbook (not this file).
#
# `issue-link` (gh#406) is ADVISORY and must stay that way: it never fails and is not a required
# check. Plenty of PRs legitimately close nothing -- one against an epic, or a QA suite that PINS a
# defect rather than fixing it -- so a hard failure would train authors to add `Closes` where it does
# not belong, and a wrongly-closed issue is harder to notice than one left open.
#
# COMBINING PRS IS NOT `stale-base`'S JOB (gh#357). `stale-base` guards a STACKED PR whose base branch
# already merged (gh#72); it has nothing to say about two PRs that are each green against `develop` and
# break only once both land. That gap is closed by **`strict`** on the protect-develop ruleset (gh#575)
# -- a PR must be up to date with `develop` before it can merge, so CI always compiles the combination.
# A merge queue would be the better tool but needs an ORG-owned repo; this one is personal-account, so
# the rule is rejected. The `merge_group:` trigger below stays anyway: it is inert without a queue and
# makes enabling one a single checkbox if that ever changes. `stale-base` is unchanged and is a
# different guard. See the deployment runbook, *Combining-PR protection on `develop`*.

on:
  pull_request:
    # No `branches` filter: the ladder governs staging/main, and the stale-base guard
    # must see every other base (gh#72), so the workflow runs on all PR bases.
    # `labeled` / `unlabeled` so adding the exception label re-runs the check.
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  # `commit-hygiene` is a REQUIRED check, so it must also report on the queue's ref or every queued PR
  # waits forever (gh#357). Only that job runs here -- the other three are PR-scoped and are guarded
  # off below, because a `merge_group` event carries no pull_request context to evaluate them against.
  merge_group:

concurrency:
  group: branch-policy-${{ github.ref }}
  # Never cancel a queue run: the merge queue is waiting on this check to report, and a cancelled run
  # reports nothing. Superseded PR runs are still cancelled, which is what this was for.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ladder:
    name: ladder
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate the base/head pair
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          # `head_ref` is only the short branch name, so on its own a fork branch *named* `staging`
          # or `develop` would satisfy the ladder. Identity of the head repository is checked too.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          # Whether the PR carries the documented escape hatch for staging.
          HAS_EXCEPTION: ${{ contains(github.event.pull_request.labels.*.name, 'ladder-exception') }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD -> $BASE (head repo: ${HEAD_REPO:-unknown})"

          # The ladder governs *this* repository's promoted history. A fork's `staging` is a
          # different lineage, so this is checked before the branch name and carries no exception:
          # the label exists to excuse a branch deviation, not a foreign repository. Fork
          # contributions target `develop`, which has no ladder constraint.
          if [ "${HEAD_REPO:-}" != "$REPO" ]; then
            echo "::error::'$BASE' accepts merges from branches in '$REPO' only — got '$HEAD' on '${HEAD_REPO:-an unknown repository}'. Open fork contributions against 'develop' instead. See CONTRIBUTING.md 'Branching model'."
            exit 1
          fi

          case "$BASE" in
            main)
              # No exception. Production history stays single-source so every release
              # traces back through staging.
              if [ "$HEAD" != "staging" ]; then
                echo "::error::'main' accepts merges from 'staging' only — got '$HEAD'. There is no exception for main; promote through staging instead. See CONTRIBUTING.md 'Branching model'."
                exit 1
              fi
              echo "OK: staging -> main."
              ;;

            staging)
              if [ "$HEAD" = "develop" ]; then
                echo "OK: develop -> staging."
              elif [ "$HAS_EXCEPTION" = "true" ]; then
                echo "::warning::'staging' normally accepts 'develop' only, but this PR carries the 'ladder-exception' label — allowing '$HEAD'. The reason must be stated in the PR description."
              else
                echo "::error::'staging' accepts merges from 'develop' only — got '$HEAD'. If this is a justified exception, state the reason in the PR description and add the 'ladder-exception' label. See CONTRIBUTING.md 'Branching model'."
                exit 1
              fi
              ;;

            *)
              echo "No ladder constraint for base '$BASE'."
              ;;
          esac

  # gh#72: a PR based on a feature branch that has ALREADY merged into develop merges
  # green, closes, and lands its work on a branch nothing will ever merge again. Squash
  # merges rewrite history, so ancestry of the base's tip proves nothing -- the reliable
  # signal is a merged PR whose head was this base branch.
  stale-base:
    name: stale-base
    runs-on: ubuntu-latest
    # Only stacked PRs need this; develop/staging/main are governed by the ladder. The event guard is
    # not redundant: on a `merge_group` event `github.base_ref` is EMPTY, which the branch test alone
    # would read as "not a long-lived branch" and run the job against a PR that isn't there (gh#357).
    if: ${{ github.event_name == 'pull_request' && !contains(fromJSON('["develop", "staging", "main"]'), github.base_ref) }}
    permissions:
      pull-requests: read
    steps:
      - name: Fail if the base branch has already merged
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Stacked PR: base '$BASE' is not a long-lived branch."

          MERGED=$(gh pr list --repo "$REPO" --state merged --head "$BASE" --json number --jq '[.[].number] | join(", #")')
          if [ -n "$MERGED" ]; then
            echo "::error::Base branch '$BASE' already merged (PR #$MERGED). Merging this PR would land its work on a finished branch nothing will merge again (gh#72). Retarget this PR's base to 'develop'."
            exit 1
          fi

          # Legitimately stacked (base still unmerged). One known blind spot: GitHub fires
          # no event on this PR when its base merges later, so the red only appears on the
          # next push/edit/label. Deleting merged branches closes it -- GitHub then auto-
          # retargets child PRs to the deleted branch's own base.
          echo "::warning::Stacked PR (base '$BASE'). Fine while the base is unmerged -- but if the base merges first, retarget this PR to 'develop' before merging it (gh#72)."
          echo "OK: no merged PR has head '$BASE'."

  # gh#104: PRs land by rebase-merge, so every branch commit becomes permanent history.
  # Enforce the floor of "curated units of work": Conventional subjects, no leftover
  # fixup!/squash!/wip commits. Merge commits are skipped -- GitHub's rebase-merge drops
  # them on landing. GitHub-generated 'Revert "..."' subjects pass.
  commit-hygiene:
    name: commit-hygiene
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # On `merge_group` there is no PR to ask, so the commit list comes from the queue ref instead --
      # `base_sha..head_sha` is exactly the set being merged, so this stays a real check rather than a
      # vacuous pass (gh#357). Full history is needed for that range to resolve.
      - name: Check out the queued commits
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 0
      - name: Check every commit is a curated unit of work
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          TYPES='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          FAIL=0
          COUNT=0
          while IFS=$'\t' read -r sha parents subject; do
            COUNT=$((COUNT + 1))
            if [ "$parents" -gt 1 ]; then
              echo "SKIP  $sha (merge commit -- rebase-merge drops it): $subject"
              continue
            fi
            if printf '%s' "$subject" | grep -qiE '^(fixup!|squash!|amend!)|^wip\b'; then
              echo "::error::$sha is a leftover work-in-progress commit ('$subject'). Interactive-rebase the branch into units of work before merge (engineering S10, gh#104)."
              FAIL=1
            elif ! printf '%s' "$subject" | grep -qE "^Revert \"|^(${TYPES})(\([[:alnum:]._/-]+\))?!?: .+"; then
              echo "::error::$sha subject is not a Conventional Commit ('$subject'). Every rebase-merged commit becomes permanent history -- give it a type and a purpose (engineering S10, gh#104)."
              FAIL=1
            else
              echo "OK    $sha: $subject"
            fi
          done < <(
            if [ "$EVENT" = "merge_group" ]; then
              # The queue ref holds the queued PR stacked on the base plus everything ahead of it;
              # base_sha..head_sha is precisely the commits this merge would add.
              git log --format='%h%x09%p%x09%s' "$MG_BASE..$MG_HEAD" \
                | awk -F'\t' '{n=split($2,p," "); print $1 "\t" n "\t" $3}'
            else
              gh api "repos/$REPO/pulls/$PR/commits" --paginate \
                --jq '.[] | [.sha[0:7], (.parents | length | tostring), (.commit.message | split("\n")[0])] | @tsv'
            fi
          )
          echo "$COUNT commit(s) checked."
          # A queue run with zero commits means the range resolved to nothing -- treat it as a fault
          # rather than a pass, because "checked nothing" must never read the same as "all clean".
          if [ "$EVENT" = "merge_group" ] && [ "$COUNT" -eq 0 ]; then
            echo "::error::No commits found in $MG_BASE..$MG_HEAD. The queue ref did not resolve, so nothing was actually checked (gh#357)."
            exit 1
          fi
          exit $FAIL

  issue-link:
    name: issue-link
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Warn when a PR references issues but closes none
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # GROUND TRUTH IS GITHUB'S OWN RESOLVED LINKS, not a regex over the body (gh#406).
          #
          # A pattern match answers "does this text look linked?", which is the wrong question -- twice today a
          # PR carried `Closes #N` in its TITLE, which reads correct to a human and to a naive grep, and GitHub
          # silently ignores (keywords bind from the body and commit messages only). closingIssuesReferences is
          # by definition the set that WILL close on merge, so anything absent from it will not, whatever the
          # prose says.
          CLOSES=$(gh api graphql -f query='
            query($o:String!, $r:String!, $n:Int!) {
              repository(owner:$o, name:$r) {
                pullRequest(number:$n) { closingIssuesReferences(first:20) { nodes { number } } }
              }
            }' -f o="$OWNER" -f r="$NAME" -F n="$PR" \
            --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[].number] | join(", #")')

          if [ -n "$CLOSES" ]; then
            echo "OK — this PR closes #$CLOSES on merge."
            echo "This PR closes **#$CLOSES** on merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REFERENCED=$(printf '%s' "${BODY:-}" | grep -oiE '#[0-9]+' | sort -u -V | paste -sd' ' - || true)
          if [ -z "$REFERENCED" ]; then
            echo "OK — this PR references no issues, so there is nothing it could have meant to close."
            exit 0
          fi

          # It references issues and closes none. That is often correct -- a PR against an epic, a QA suite that
          # PINS a defect rather than fixing it, a hotfix whose issue another PR closes. So this warns and never
          # fails, and is deliberately NOT a required check: a hard failure would train authors to add `Closes`
          # to PRs that should not have it, and a wrongly-closed issue is harder to notice than an open one.
          echo "::warning title=No closing keyword::This PR references $REFERENCED but will close nothing on merge. If it finishes one of those, add 'Closes #N' to the PR BODY."
          {
            echo "### :link: No closing keyword"
            echo
            echo "This PR references **$REFERENCED** and will **close nothing** when merged."
            echo
            echo "That is fine if it genuinely finishes none of them — a PR against an epic, or a QA suite that"
            echo "*pins* a defect rather than fixing it, correctly uses \`Related to #N\`."
            echo
            echo "If it does finish one, add \`Closes #N\` **to the body**. Leaving it off means the issue stays"
            echo "open, the board keeps advertising finished work, and a parallel session picks it up (gh#406)."
          } >> "$GITHUB_STEP_SUMMARY"

          # The near misses -- where the author BELIEVED they had linked it, which is the dangerous shape.
          KEYWORDS='clos(e|es|ed)|fix(es|ed)?|resolve(s|d)?'
          if printf '%s' "$TITLE" | grep -qiE "(${KEYWORDS})[[:space:]]+[^[:alnum:]#]{0,3}#[0-9]+"; then
            echo "::warning title=Closing keyword is in the title::GitHub honours closing keywords in the PR BODY and commit messages, never the title. Move it into the body."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> :warning: The **title** carries a closing keyword. GitHub honours those in the **body** and" >> "$GITHUB_STEP_SUMMARY"
            echo "> commit messages only — never the title. Move it into the body." >> "$GITHUB_STEP_SUMMARY"
          fi

          NEAR=$(printf '%s' "${BODY:-}" \
            | grep -oiE '(settles|delivers|completes|implements|addresses|finishes)[[:space:]]+[^[:alnum:]#]{0,3}#[0-9]+' | head -3 || true)
          if [ -n "$NEAR" ]; then
            echo "::warning title=Not a closing keyword::'$(printf '%s' "$NEAR" | head -1)' reads like a link but is not one. GitHub only acts on close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> :warning: The body says \`$(printf '%s' "$NEAR" | head -1)\`, which **reads** like a link but is not" >> "$GITHUB_STEP_SUMMARY"
            echo "> one. GitHub acts only on \`close/closes/closed\`, \`fix/fixes/fixed\`, \`resolve/resolves/resolved\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Advisory by design: never fail, so this can never deadlock a merge.
          exit 0
