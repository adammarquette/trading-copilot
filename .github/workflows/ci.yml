name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]
  # THE MERGE QUEUE'S CHECKS RUN HERE (gh#357). A queued PR is tested on a temporary
  # `gh-readonly-queue/...` ref holding it stacked on the base plus everything ahead of it -- which is
  # the whole point: two PRs that pass alone but break combined are caught BEFORE either lands (gh#351).
  # This trigger is load-bearing: a required check that never runs on `merge_group` leaves every queued
  # PR waiting forever, the same deadlock the platform contract warns about for `stale-base`. The
  # publish / deploy / verify jobs below are guarded on `github.event_name == 'push'`, so a queue run
  # builds and tests only -- it never publishes an image or deploys.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only superseded PR runs. A push run publishes an image (and, once wired, deploys it), so it
  # must finish -- a concurrent merge cancelling it mid-publish is how the #80 run was lost (gh#82).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # external/ holds four public client submodules the adapters build against (gh#1023).
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The compose `environment:` map is an ALLOWLIST, so a key documented in .env.example but missing from it
      # is silently dropped -- the operator sets it, the app never sees it, nothing says so. That has landed on
      # the R-13 flatten deadlines (gh#236) and the watchlist (gh#304), and three more were caught only because
      # the author happened to remember. Runs early: it needs no build, and a config gap is worth knowing about
      # before spending three minutes on tests. Same script developers run locally (gh#325).
      - name: Env forwarding (compose allowlist)
        run: ./scripts/check-env-forwarding.sh

      # A rule with two homes drifts, and the drift is invisible until an agent reads the stale copy and behaves
      # wrong WHILE CITING A DOC AS ITS AUTHORITY. The gh#616 audit found ten live instances -- the board told
      # agents to self-assign to avoid collisions while CONTRIBUTING.md said that signal is worthless here; the
      # reviewer checklist dropped "bug fixes are regression-first", exactly where it would be enforced. Docs-only
      # and needs no build, so it runs beside the other config gate (gh#616).
      - name: Doc duplication (one rule, one home)
        run: ./scripts/check-doc-duplication.sh

      # Alert-rule drift and missing coverage fail the PR (gh#585): observability/rules/tests/*.yml is an executable
      # promtool suite that nothing ran, so a rule shipped with no test (gh#537) and a test silently drifted red from
      # its rule (gh#482) -- the same silent-monitor class ADR-0019 closes, one layer up. Runs the SAME pinned-image
      # script (v3.0.1, matching docker-compose) a developer runs locally, so the local check matches CI. It needs
      # Docker (on the runner) but no .NET, so it sits with the other no-build gates ahead of restore. The script
      # pulls the image once with a retry, so a transient anonymous-Docker-Hub 429 does not flake this required
      # gate (gh#585 review); Docker Hub auth is the fuller fix if that recurs.
      - name: Alert rules (promtool check + test)
        run: ./scripts/check-alert-rules.sh

      # The `## Decision log` convention (gh#492 for ADR-0007, gh#524 for ADR-0008) is maintained by hand and keeps
      # re-drifting: gh#580 had to RE-fix ADR-0007 after five updates (gh#530/#529/#532/#531/#577) accumulated AFTER
      # `## Follow-ups`, so a reader again met a non-final "final" list -- the third manual fix of one class. This
      # asserts the structure (Follow-ups last, index matches the trail, dates ascending) so the next drifting append
      # fails here at PR time, not by a fourth re-fix. Docs-only and needs no .NET, so it runs with the other
      # no-build gates ahead of restore (gh#600).
      - name: ADR decision-log invariants
        run: ./scripts/check-adr-decision-log.sh

      # documentation/integration-test-audit.md §2 is the map an agent reads to answer "is this path already
      # covered?", and it has drifted twice: gh#490 reconciled it by hand on 2026-07-30, yet the 2026-08-14 audit
      # found 22 suites with no row and gh#862 found 27 two days later. A map missing a quarter of the territory
      # answers that question wrong in both directions -- a suite gets rewritten because it looked unwritten, or a
      # real gap stays invisible. The ADR index above does not drift for exactly one reason, and it is this line.
      # Docs-only, no .NET, no network, ~2s -- sits with the other no-build gates ahead of restore (gh#862).
      - name: Integration-test inventory (§2 matches the suites on disk)
        run: ./scripts/check-integration-test-inventory.sh

      # claim.sh is the collision guard every session runs first (gh#375); when its branch-name match reports
      # "unclaimed" for a genuinely claimed issue, a parallel session double-works. gh#833 was exactly that -- a
      # Cursor Cloud branch carries the id in the MIDDLE (`cursor/<name>-<id>-<suffix>`), invisible to the old
      # `/<id>_` anchor. This runs the shared match against a fixture branch list, so the guard's own correctness
      # is itself a gate. No .NET, no network -- sits with the other no-build checks ahead of restore.
      - name: Claim branch-match (collision guard)
        run: ./scripts/tests/claim.test.sh

      # gh#839: submodule-guard attributes a pin change to the PR that made it by diffing from the merge-base
      # (three-dot), not the two branch tips. The old two-dot form false-failed EVERY open PR that never touched
      # external/ the moment a legitimate bump landed on develop -- the safety alarm ("this reverted a merged fix!")
      # cried on innocent PRs, all at once. This runs the shared diff rule against a synthetic-gitlink fixture so the
      # fix cannot regress. No .NET, no network -- sits with the other no-build checks ahead of restore.
      - name: Submodule-pin merge-base diff (guard correctness)
        run: ./scripts/tests/submodule-pins.test.sh

      # gh#994: the advisory `reviewer` workflow degrades an Anthropic API / provisioning failure the PR
      # author cannot fix (no credit, 401, 429, 5xx) to a clean skip instead of reddening every PR -- a red
      # check nobody can fix trains people to ignore reds. This runs the shared classifier against the
      # verbatim result JSON of that failure so the degrade cannot regress into a red-on-every-PR, while a
      # genuine reviewer failure still reddens. No .NET, no network -- sits with the other no-build checks.
      - name: Reviewer outcome classifier (degrade API errors, keep real failures red)
        run: ./scripts/tests/reviewer-outcome.test.sh

      # gh#1028: `verdict:watching` is what tells a coordinator a live author from a dead one, so a coordinator
      # launches a reviewer whenever it is absent. Both ways of getting the lifecycle wrong are silent and both
      # cost real work -- a handler that clears the label but lets the wait run on invites a second reviewer onto
      # the same head, and a label that never comes down suppresses reviewers forever. The first shipped in that
      # PR's own first round, with a review table that checked the label came off and never checked the process
      # had stopped. This runs the real script against a stub `gh` on every exit path -- signals included -- so
      # neither can regress. No .NET, no network -- sits with the other no-build checks.
      - name: Watch-verdict label lifecycle (signals, hand-off, degrade)
        run: ./scripts/tests/watch-verdict.test.sh

      - name: Restore
        run: dotnet restore src/MarqSpec.TradingCopilot.slnx

      # external/ is a vendored submodule with its own conventions -- we verify our code, not its.
      - name: Format (verify)
        run: dotnet format src/MarqSpec.TradingCopilot.slnx --verify-no-changes --no-restore --exclude external/

      - name: Build
        run: dotnet build src/MarqSpec.TradingCopilot.slnx --configuration Release --no-restore

      # Unit tests here; the pre-merge integration tier runs in its own job below. Staging/venue
      # integration and the production smoke subset stay post-merge (engineering guide §5).
      - name: Unit tests
        run: dotnet test src/MarqSpec.TradingCopilot.UnitTests/MarqSpec.TradingCopilot.UnitTests.csproj --configuration Release --no-build

  # Pre-merge integration tier (gh#121): the venue-independent QA suites run against a throwaway
  # PostgreSQL container (Testcontainers, the same image the compose stack runs), so the real
  # migrations and DB-level guards are exercised on every PR. Staging/venue integration and the
  # production smoke subset remain post-merge tiers (engineering guide §5, §10).
  # The SPA (gh#646). Its own job rather than steps inside build-test: it needs no .NET SDK and no submodule, so it
  # starts immediately and reports in well under a minute -- a client-only PR learns it is red without waiting on a
  # restore it never needed. A red client build fails the PR exactly as a red .NET build does, which is the point:
  # the bundle ships inside the API image (ADR-0020), so a client that does not compile is a deploy that cannot be
  # built.
  client:
    name: client (build, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MarqSpec.TradingCopilot.Client
    steps:
      - uses: actions/checkout@v4
        # No submodules: the client builds against none of them.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/MarqSpec.TradingCopilot.Client/package-lock.json

      # `npm ci`, never `npm install` -- it installs the lockfile exactly and fails if package.json and the lock
      # have drifted, which is the npm equivalent of the reproducible restore the .NET side already relies on.
      - name: Install
        run: npm ci

      # Lint and format are separate gates for the same reason `dotnet format --verify-no-changes` is its own step:
      # they fail rather than fix, so the diff a reviewer reads is the diff the author wrote.
      - name: Lint
        run: npm run lint

      - name: Format (verify)
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration-test:
    name: integration tests (pre-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MarqSpec.TradingCopilot.slnx

      # `Category!=Smoke` excludes the Smoke-tagged suite: the production smoke subset is a
      # deploy-time tier (engineering guide §5/§10), not a pre-merge one (gh#159). The deploy step
      # that runs smoke selects the complement — `--filter "Category=Smoke"` — so the two tiers stay
      # disjoint and the tier comments above are true statements about the job.
      - name: Integration tests (Testcontainers Postgres)
        run: dotnet test src/MarqSpec.TradingCopilot.IntegrationTests/MarqSpec.TradingCopilot.IntegrationTests.csproj --configuration Release --filter "Category!=Smoke"

  # Build the image WITHOUT publishing it, so an image-only break fails the PR that caused it (gh#692).
  #
  # Why this is not covered by the jobs above: every one of them runs from a FULL checkout, while the
  # Dockerfile COPYs a SUBSET of the tree. The image is therefore the only consumer of a partial repo, and
  # the only place a "the build needs a file the Dockerfile never copies" defect can exist at all. gh#691
  # was exactly that -- `.npmrc` missing from the client manifests layer -- and it failed `publish image`
  # on SEVEN consecutive develop commits while every PR reported clean, because publishing only runs after
  # merge. Nothing was deployable for over an hour and no check said so.
  #
  # It runs on pull_request AND merge_group, never on push -- the exact complement of publish-image below,
  # which does the real build-and-push on merges. Covering merge_group is load-bearing twice over: this is
  # a required check, and the header's warning applies (a required check that never runs there leaves every
  # queued PR waiting forever), and the queue is also where two PRs that each build alone but break combined
  # would surface.
  #
  # It does NOT push and takes no packages:write. That is the whole of publish-image's "a PR must not
  # publish" rationale -- a fork PR cannot hold that scope -- and none of it argues against BUILDING.
  #
  review-verdict:
    name: review-verdict
    # A task is done when its PR is APPROVED and green -- not when the branch is pushed (engineering §10).
    # This job is what makes that binding rather than a norm.
    #
    # WHY A MARKER AND NOT THE NATIVE REVIEW STATE: `gh` authenticates as the repository owner, who is also
    # the PR author, and GitHub BLOCKS SELF-APPROVAL -- every review in this repo's history is COMMENTED,
    # the Copilot reviewer's included. So the reviewer records its verdict as the first line of the review
    # body -- the `**Verdict: Approve**` line the reviewer contract already established (gh#141), in use
    # across gh#761/#768/#773/#781. This job turns that convention into a gate. A native APPROVED state is
    # honoured too: that is what the reviewer GitHub App (.github/scripts/reviewer-review.sh) emits once
    # provisioned, and nothing here has to change on that day.
    #
    # NOT `pull_request_review`-triggered: a required check must run on the PR's own event, and a job that
    # only fires on review would never report on a PR with no review at all -- which is exactly the state
    # this exists to block.
    #
    # IT RUNS LAST, AND IT WAITS. The first cut did neither, and gh#782 is what that looks like: the job
    # started 4 seconds into the run and failed before any reviewer could have looked at the diff. Two
    # fixes, both necessary:
    #   * `needs` the other quality jobs, so a reviewer is never asked to rule on a diff that does not
    #     build, and the verdict is the LAST thing the PR waits on rather than the first thing it fails.
    #   * poll instead of judging once. A verdict is a human-paced event; a single read at t=0 measures
    #     nothing but how fast CI starts.
    #
    # WHEN THIS IS PROMOTED TO A REQUIRED CHECK, CHECK THE SKIP SEMANTICS FIRST: `needs` means a failure
    # upstream leaves this job SKIPPED, and a skipped required check is the deadlock the platform contract
    # warns about for `stale-base`. It is deliberately not required yet.
    needs: [build-test, client, integration-test, build-image]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Backstop above the in-script deadline, so the script reports the timeout rather than the runner
    # killing it with no explanation.
    timeout-minutes: 35
    permissions:
      pull-requests: read
      contents: read
    steps:
      # Real history, because verdict-state.sh compares the PR's own contribution at two different commits
      # and has to resolve each against its merge base. `submodules` is deliberately OFF: this job
      # compiles nothing, so cloning `external/` would be pure cost.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Wait for a binding review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEADLINE_MINUTES: "30"
          POLL_SECONDS: "60"
        run: |
          set -uo pipefail

          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          attempt=0

          while :; do
          attempt=$(( attempt + 1 ))

          # THE RULING IS NOT THIS JOB'S -- it belongs to .github/scripts/verdict-state.sh, which owns the
          # lenient first-line parsing, the contribution comparison that lets an approval survive a sync
          # merge, and the orphaned-rebase fallback. scripts/watch-verdict.sh calls the SAME script, because
          # that is the author agent's side of this same wait (gh#815): two copies of the logic would drift
          # into the gate and the author disagreeing about whether a PR is approved. This job owns the
          # WAITING and the wording; the head and base come from the event payload, so the ruling is about
          # the commit this run actually tested rather than whatever is at the tip now.
          verdict=""; vsha=""; rounds=0; vid=""
          detail="The verdict could not be read (transient API failure?)"
          if line=$(./.github/scripts/verdict-state.sh "$PR" \
                      --head "$HEAD_SHA" --base "$BASE_REF" --repo "$REPO"); then
            # `|`, not a tab -- a tab is IFS whitespace, so a run of them collapses and the empty fields on a
            # NONE line shift every later field left. DETAIL is last so it cannot be split either way.
            IFS='|' read -r verdict vsha rounds vid detail <<<"$line"
          else
            echo "::warning::verdict-state.sh could not answer -- treating this poll as 'no verdict yet'."
          fi

          # CHANGES-REQUESTED ends the wait immediately. Polling on it would burn 30 minutes waiting for
          # something only a PUSH can resolve -- and a push starts a fresh run anyway.
          if [ "$verdict" = "CHANGES-REQUESTED" ]; then
            echo "::error::Review requested changes (round $rounds):" \
                 "https://github.com/$REPO/pull/$PR#pullrequestreview-$vid --" \
                 "on ${vsha:0:7}. Address the feedback, push, and ask for re-review; the task is not done until" \
                 "the verdict is Approve and checks are green. The author agent waits on this with" \
                 "scripts/watch-verdict.sh (engineering §10)."
            exit 1
          fi

          if [ "$verdict" = "APPROVED" ]; then
            # $detail is printed verbatim: it arrives sentence-cased from verdict-state.sh, which is where
            # that casing belongs. `${detail^}` here was Bash 4 -- harmless on this runner, fatal under the
            # Bash 3.2 macOS ships, and the same line existed in scripts/watch-verdict.sh where it ran on
            # exactly such a host (PR #818 review). One idiom, no host it cannot run on.
            echo "$detail."
            exit 0
          fi

          now=$(date +%s)
          if [ "$now" -ge "$deadline" ]; then
            echo "::error::Timed out after ${DEADLINE_MINUTES}m waiting for a review verdict. $detail." \
                 "The reviewer records one as the FIRST LINE of a review body:" \
                 "'**Verdict: Approve**' or '**Verdict: Request changes**'" \
                 "(documentation/agents/code-reviewer.md). A PR COMMENT carrying that line does not count and" \
                 "never has -- this job reads reviews -- so if a reviewer reported posting one, check it had an" \
                 "identity with pull_requests: write (.github/scripts/post-verdict.sh preflight, gh#811)." \
                 "Re-run this job once the review is in."
            exit 1
          fi

          # One line per poll is 30 lines over the whole wait -- readable, and it makes "how long did the
          # reviewer take" answerable from the log afterwards.
          printf 'attempt %d: %s -- waiting %ss (%dm left)\n' \
            "$attempt" "$detail" "$POLL_SECONDS" "$(( (deadline - now) / 60 ))"
          sleep "$POLL_SECONDS"
          done

  # Deliberately NOT path-filtered. gh#691's break was introduced by a PR that never touched the Dockerfile:
  # `.npmrc` arrived with the client scaffold and only became load-bearing later. A filter keyed on
  # Dockerfile/client paths would have skipped that PR and missed the defect it shipped, which is the exact
  # failure this job exists to prevent.
  build-image:
    name: build image (no publish)
    # Gated on build-test purely to avoid burning Buildx minutes on a PR that is already broken: the image build
    # consumes nothing build-test produces and targets an unrelated failure mode (a Docker COPY subset, not a
    # full-checkout `dotnet build`), so this is a cost choice, not a correctness one. The trade is that the
    # image-break signal arrives after the workflow's longest job rather than in parallel with `client` and
    # `integration-test` -- drop this line if that feedback delay ever costs more than the wasted minutes would
    # (PR #694 review).
    needs: build-test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile COPYs external/ (the four client submodules) into the build.
          submodules: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MarqSpec.TradingCopilot.Api/Dockerfile
          push: false
          # Read the cache publish-image writes on develop, but do not write one back: a PR's layers are
          # throwaway, and populating the shared cache from unmerged branches only adds eviction pressure
          # on the entries that make the real publish fast.
          cache-from: type=gha

  # Build the deployment image ONCE and publish it to GHCR, so local dev and Railway consume the
  # same artifact rather than each rebuilding from source (ADR-0018, extends ADR-0012).
  publish-image:
    name: publish image (GHCR)
    needs: build-test
    # Merges only. A PR must not publish an image: the code is not yet on a long-lived branch, and a
    # fork PR cannot be granted packages:write anyway. Tags map to the branch's environment (§8).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile COPYs external/ (the four client submodules) into the build.
          submodules: true

      # Required for `cache-to: type=gha` below: the default `docker` driver cannot export a build
      # cache, so without the docker-container driver this step provides, the build fails (gh#82).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch -> tag (:develop, :staging, :main) plus an immutable :sha-<short> for pinning a rollback
      # to an exact build. github.repository is already lowercase, which GHCR requires.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MarqSpec.TradingCopilot.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers across builds on the same branch -- the SDK restore/publish is the slow part.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------------------------------------
  # Pipeline steps 4-6 (gh#379): deploy the artifact CI just published, then prove the deployed instance serves.
  # ---------------------------------------------------------------------------------------------------------

  deploy:
    name: deploy (Railway)
    needs: publish-image
    # Merges only, and NEVER main. Production deploy and rollback are human-approved, never automatic
    # (Platform contract, non-negotiable) -- a merge-triggered production deploy would break that rule by
    # construction, so `main` is excluded here rather than guarded by a setting someone can forget to apply.
    # Promoting to production stays the runbook's manual procedure.
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.trigger.outputs.deployed }}
    steps:
      # Both hooks are read into the environment because a secret name cannot be built dynamically in an
      # expression; the branch selects between them in the step below.
      - name: Trigger the Railway deploy
        id: trigger
        env:
          HOOK_DEV: ${{ secrets.RAILWAY_DEPLOY_HOOK_DEV }}
          HOOK_STAGING: ${{ secrets.RAILWAY_DEPLOY_HOOK_STAGING }}
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            develop) HOOK="${HOOK_DEV:-}";     TARGET="dev" ;;
            staging) HOOK="${HOOK_STAGING:-}"; TARGET="staging" ;;
            *)       echo "::error::Unreachable: the job guard already excluded this branch."; exit 1 ;;
          esac

          # Skip rather than fail when the hook is unset. The Railway environments and the image-sourced
          # services are operator console actions CI cannot perform (runbook, ADR-0018), so until they exist
          # this job must be inert -- the runbook deliberately refused to "half-wire a deploy trigger against a
          # not-yet-image-sourced service", and a red pipeline on every merge would be exactly that.
          if [ -z "$HOOK" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No RAILWAY_DEPLOY_HOOK for '$TARGET' — skipping the deploy. Set the secret once the environment exists (runbook: Operator setup)."
            exit 0
          fi

          echo "Deploying ghcr.io/${{ github.repository }}:${{ github.ref_name }} to '$TARGET'."
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                     --max-time 30 --request POST "$HOOK") || status="000"

          if [ "$status" != "200" ] && [ "$status" != "204" ]; then
            echo "::error::Railway deploy hook for '$TARGET' returned HTTP $status."
            exit 1
          fi

          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Deploy requested."

  verify:
    name: verify (deployed instance)
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # /ready, not /health: /health answers from the process and returns 200 even when the database is
      # unreachable, which is the failure a post-deploy check exists to catch. GET-only, read-only.
      - name: Probe /ready
        env:
          BASE_DEV: ${{ secrets.DEPLOY_BASE_URL_DEV }}
          BASE_STAGING: ${{ secrets.DEPLOY_BASE_URL_STAGING }}
        run: |
          set -euo pipefail
          case "${{ github.ref_name }}" in
            develop) BASE="${BASE_DEV:-}" ;;
            staging) BASE="${BASE_STAGING:-}" ;;
          esac

          if [ -z "$BASE" ]; then
            echo "::error::Deployed '${{ github.ref_name }}' but DEPLOY_BASE_URL is unset, so the release cannot be verified."
            echo "::error::An unverified deploy is not a successful one — set the secret (runbook: Operator setup)."
            exit 1
          fi

          scripts/verify-deploy.sh "$BASE"
