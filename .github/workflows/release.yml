name: Release container image

# Triggered by a published GitHub release. CI already published :sha-<short> on merge
# (ADR-0018); this workflow retags that digest as :VERSION — it does not rebuild and it never
# references :latest. It requires a human approval first (the `production` environment).
#
# It does NOT deploy. The AWS deploy jobs that used to follow the retag (ADR-0030) were removed
# with the AWS plan (gh#1215, gh#1232); a Railway deploy path is the next step (gh#1232). The
# outputs of `publish` (the digest and the version) are kept for it.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # THE JOB BELOW IS INERT WITHOUT A SETTING THIS FILE CANNOT DECLARE.
  # `environment: production` does not create or require anything: if the environment
  # does not exist, GitHub CREATES IT AT RUN TIME WITH NO PROTECTION RULES. This job
  # declares NO environment: of its own — a check on the approval gate that is itself
  # gated by the approval gate can only run after the thing it is checking has already
  # let it through. scripts/bootstrap.sh creates the environments.
  verify-gate:
    name: Verify the approval gate is real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The release approval gate exists and requires a human
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-release-gate.sh

      - name: Self-test — that check still rejects an inert gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-release-gate-selftest.sh

  gate:
    name: Await release approval
    needs: verify-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Release approved
        run: echo "Release approved - proceeding to retag."

  publish:
    name: Retag the merge-published digest
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      version: ${{ steps.tag.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag looks like a version
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve the image reference
        run: |
          ref="$(./scripts/image-reference.sh)"
          [ -n "$ref" ] || { echo "::error::image-reference.sh exited 0 without naming a reference"; exit 1; }
          echo "IMAGE=$ref" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retag, do not rebuild (ADR-0018). The merge already published :sha-<short>.
      # Assigned on its own line, then checked — a failed inspect must not export an
      # empty digest and then deploy :latest.
      - name: Retag the published digest as the release version
        id: digest
        run: |
          short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          source="${IMAGE}:sha-${short}"
          raw="$(docker buildx imagetools inspect "${source}" --format '{{json .Manifest.Digest}}')"
          [ -n "$raw" ] || { echo "::error::imagetools inspect returned no digest for ${source}"; exit 1; }
          digest="$(printf '%s' "$raw" | tr -d '"')"
          [ -n "$digest" ] || { echo "::error::digest was empty after stripping quotes"; exit 1; }
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo "::error::digest '$digest' is not sha256:<64 hex>"; exit 1; }
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${source}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
